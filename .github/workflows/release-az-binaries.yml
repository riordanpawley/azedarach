name: Release az binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: darwin-arm64
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            label: darwin-x64
            goos: darwin
            goarch: amd64
          - os: ubuntu-24.04
            label: linux-x64
            goos: linux
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build standalone binaries
        run: |
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/riordanpawley/azedarach/internal/buildinfo.Version=${VERSION}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="$LDFLAGS" -o "release-assets/az-${{ matrix.label }}" ./cmd/az
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="$LDFLAGS" -o "release-assets/azd-${{ matrix.label }}" ./cmd/azd

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          shasum -a 256 "az-${{ matrix.label }}" > "az-${{ matrix.label }}.sha256"
          shasum -a 256 "azd-${{ matrix.label }}" > "azd-${{ matrix.label }}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: az-${{ matrix.label }}
          path: |
            release-assets/az-${{ matrix.label }}
            release-assets/az-${{ matrix.label }}.sha256
            release-assets/azd-${{ matrix.label }}
            release-assets/azd-${{ matrix.label }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: az-*
          path: release-assets
          merge-multiple: true

      - name: Build checksum manifest
        run: |
          cd release-assets
          cat ./*.sha256 > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  smoke-release-assets:
    name: Smoke released assets (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: darwin-arm64
          - os: macos-15-intel
            label: darwin-x64
          - os: ubuntu-24.04
            label: linux-x64
    permissions:
      contents: read

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "az-${{ matrix.label }}" --pattern "azd-${{ matrix.label }}" --dir smoke --clobber

      - name: Run smoke checks
        run: |
          chmod +x "smoke/az-${{ matrix.label }}" "smoke/azd-${{ matrix.label }}"
          "./smoke/az-${{ matrix.label }}" --version
          "./smoke/az-${{ matrix.label }}" --help
          "./smoke/azd-${{ matrix.label }}" --version
          "./smoke/azd-${{ matrix.label }}" --help
