name: ts-opentui boundaries

on:
  pull_request:
    paths:
      - "ts-opentui/**"
      - ".github/workflows/ts-opentui-boundaries.yml"

jobs:
  boundary-check:
    name: Lint, type-check, and package boundaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ts-opentui
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: ts-opentui
        run: bun run lint

      - name: Type-check
        working-directory: ts-opentui
        run: bun run type-check

      - name: Check package boundaries
        working-directory: ts-opentui
        run: bun run check:boundaries
