extensions:
  jaeger_query:
    storage:
      traces: local
  jaeger_storage:
    backends:
      local:
        badger:
          directories:
            keys: /badger/keys
            values: /badger/values
          ephemeral: false
          ttl:
            spans: ${env:JAEGER_BADGER_TTL:-24h}
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:JAEGER_MEMORY_LIMIT_MIB:-768}
    spike_limit_mib: 128
  batch: {}
exporters:
  jaeger_storage_exporter:
    trace_storage: local
    queue:
      num_consumers: 2
      queue_size: 100
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [jaeger_storage_exporter]
